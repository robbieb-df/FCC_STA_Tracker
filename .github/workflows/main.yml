name: FCC STA Checker

on:
  schedule:
    # Runs once per day at 10:00 UTC (≈ 6:00 AM Eastern during EDT)
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download previous databases
        uses: dawidd6/action-download-artifact@v6
        with:
          name: sta-tracker-dbs
          path: .
          search_artifacts: true
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run STA Checker
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENTS_DFEND: ${{ secrets.ALERT_RECIPIENTS_DFEND }}
          ALERT_RECIPIENTS_SENTRYCS: ${{ secrets.ALERT_RECIPIENTS_SENTRYCS }}
        run: python sta_checker.py

      - name: Upload updated databases
        uses: actions/upload-artifact@v4
        with:
          name: sta-tracker-dbs
          path: |
            sta_tracker.db
            sta_tracker_sentrycs.db
          retention-days: 30
          overwrite: true
          if-no-files-found: warn
